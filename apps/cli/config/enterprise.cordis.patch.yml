# Enterprise-security overlay for `dsh web --patch`.
# Required environment:
# - DSH_ENTERPRISE_MASTER_KEY: base64-encoded 32-byte AES key
# - DSH_ENTERPRISE_ADMIN_PASSWORD: initial administrator password (12+ chars)

- id: credentials
  name: '@deepseek-ai/dsh-credentials-encrypted'
  config:
    path: !!js dshHomePath('enterprise/credentials.enc.json')
    currentKeyId: !!js process.env.DSH_ENTERPRISE_KEY_ID ?? 'primary'
    keys: !!js >-
      ({ [process.env.DSH_ENTERPRISE_KEY_ID ?? 'primary']:
      Buffer.from(process.env.DSH_ENTERPRISE_MASTER_KEY ?? '', 'base64') })

- id: session-persistence-jsonl
  disabled: true

# The base Web composition declares Connection before this overlay's inserted
# providers. Loader keeps it pending until enterprise auth has published both
# security services; the ordinary Web profile retains its base-only injection.
- id: connection
  inject: [webRuntime, enterpriseSecurity, enterpriseRequestContext]

- id: plugin-inventory
  config:
    profileManifestPath: !!js dshHomePath('profiles/web/package.json')
    protectedEntryIds:
      - credentials
      - enterprise-postgres
      - session-persistence-postgres
      - enterprise-auth-web
      - enterprise-cordis-runtime
      - agent-team
      - tool-agent-team
      - ui-agent-team
      - enterprise-team-runtime
      - enterprise-controller
      - tool-computer-use

- insert:
    - id: enterprise-postgres
      name: '@deepseek-ai/dsh-enterprise-postgres'
      config:
        connectionString: !!js process.env.DSH_ENTERPRISE_DATABASE_URL ?? ''
        cursorSigningKey: !!js >-
          process.getBuiltinModule('node:crypto')
          .createHmac('sha256', Buffer.from(process.env.DSH_ENTERPRISE_MASTER_KEY ?? '', 'base64'))
          .update('dsh-enterprise-catalog/cursor-signing/v1').digest()
        poolMax: !!js Number(process.env.DSH_ENTERPRISE_PG_POOL_MAX ?? '20')
        idleTimeoutMs: !!js Number(process.env.DSH_ENTERPRISE_PG_IDLE_TIMEOUT_MS ?? '30000')
        connectionTimeoutMs: !!js Number(process.env.DSH_ENTERPRISE_PG_CONNECT_TIMEOUT_MS ?? '10000')
        ssl: !!js process.env.DSH_ENTERPRISE_PG_SSL === 'true'

    - id: session-persistence-postgres
      name: '@deepseek-ai/dsh-session-persistence-postgres'
      config:
        databaseMode: postgres
        connectionString: ''

    - id: enterprise-auth-web
      name: '@deepseek-ai/dsh-enterprise-auth-web'
      config:
        databaseMode: postgres
        databasePath: !!js dshHomePath('enterprise/identity.sqlite')
        workspaceRoot: !!js process.env.DSH_ENTERPRISE_WORKSPACE_ROOT ?? dshHomePath('enterprise/workspaces')
        organizationId: !!js process.env.DSH_ENTERPRISE_ORG_ID ?? 'default-enterprise'
        organizationName: !!js process.env.DSH_ENTERPRISE_ORG_NAME ?? 'DeepSeek Harness Enterprise'
        sessionCookieName: dsh_enterprise_session
        sessionTtlMs: 28800000
        secureCookies: !!js process.env.DSH_ENTERPRISE_SECURE_COOKIES === 'true'
        autoProvisionSsoUsers: true
        localEnabled: true
        bootstrapAdmin:
          userId: bootstrap-admin
          username: admin
          displayName: Enterprise Administrator
          passwordRef: DSH_ENTERPRISE_ADMIN_PASSWORD
        oidc: !!js JSON.parse(process.env.DSH_ENTERPRISE_OIDC ?? '[]')
        saml: !!js JSON.parse(process.env.DSH_ENTERPRISE_SAML ?? '[]')
        ldap: !!js JSON.parse(process.env.DSH_ENTERPRISE_LDAP ?? '[]')

    - id: enterprise-employee-learning
      name: '@deepseek-ai/dsh-enterprise-memory-context/learning'
      config:
        maxChars: 12000
        maxLearningBytes: 64000

    - id: enterprise-memory-context
      name: '@deepseek-ai/dsh-enterprise-memory-context'
      config:
        maxEntries: 40
        maxChars: 12000
        autoSave: true

    - id: enterprise-cordis-runtime
      name: '@deepseek-ai/dsh-enterprise-cordis-runtime'
      config:
        artifactRoot: !!js dshHomePath('enterprise/artifacts/cordis')

    # Private source-checkout Team composition. The ordinary Web profile stays
    # unchanged; the enterprise controller fails loud without this runtime.
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'

    - id: enterprise-team-runtime
      name: '@deepseek-ai/dsh-experimental-enterprise-team-runtime'

    - id: enterprise-controller
      name: '@deepseek-ai/dsh-api-enterprise-controller'

    - id: tool-computer-use
      name: '@deepseek-ai/dsh-tool-computer-use'

    - id: ui-enterprise-governance
      name: '@deepseek-ai/dsh-client-ui-enterprise-governance'
