# Enterprise-security overlay for `dsh web --patch`.
# Required environment:
# - DSH_ENTERPRISE_MASTER_KEY: base64-encoded 32-byte AES key
# - DSH_ENTERPRISE_ADMIN_PASSWORD: initial administrator password (12+ chars)

- id: credentials
  name: '@deepseek-ai/dsh-credentials-encrypted'
  config:
    path: !!js dshHomePath('enterprise/credentials.enc.json')
    currentKeyId: !!js process.env.DSH_ENTERPRISE_KEY_ID ?? 'primary'
    keys: !!js >-
      ({ [process.env.DSH_ENTERPRISE_KEY_ID ?? 'primary']:
      Buffer.from(process.env.DSH_ENTERPRISE_MASTER_KEY ?? '', 'base64') })

- insert:
    - id: enterprise-auth-web
      name: '@deepseek-ai/dsh-enterprise-auth-web'
      config:
        databasePath: !!js dshHomePath('enterprise/identity.sqlite')
        organizationId: !!js process.env.DSH_ENTERPRISE_ORG_ID ?? 'default-enterprise'
        organizationName: !!js process.env.DSH_ENTERPRISE_ORG_NAME ?? 'DeepSeek Harness Enterprise'
        sessionCookieName: dsh_enterprise_session
        sessionTtlMs: 28800000
        secureCookies: !!js process.env.DSH_ENTERPRISE_SECURE_COOKIES === 'true'
        autoProvisionSsoUsers: true
        localEnabled: true
        bootstrapAdmin:
          userId: bootstrap-admin
          username: admin
          displayName: Enterprise Administrator
          passwordRef: DSH_ENTERPRISE_ADMIN_PASSWORD
        oidc: !!js JSON.parse(process.env.DSH_ENTERPRISE_OIDC ?? '[]')
        saml: !!js JSON.parse(process.env.DSH_ENTERPRISE_SAML ?? '[]')
        ldap: !!js JSON.parse(process.env.DSH_ENTERPRISE_LDAP ?? '[]')

    - id: ui-enterprise-governance
      name: '@deepseek-ai/dsh-client-ui-enterprise-governance'
