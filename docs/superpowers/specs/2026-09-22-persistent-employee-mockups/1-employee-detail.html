<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>原型 1 · 员工详情</title>
<style>
  :root{--bg:#f7f4ef;--card:#fff;--ink:#1c1917;--sub:#8a8178;--line:#ece5da;
    --cobalt:#2b4acb;--cobalt-soft:#eef1fd;--own:#b45309;--pair:#be185d;
    --dept:#2b4acb;--org:#1c1917;--proj:#0f766e;--ok:#1a7f4f;--warn:#b45309;--radius:18px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.6;padding:44px 24px}
  .wrap{max-width:680px;margin:0 auto}
  .tag{font-size:12px;color:var(--sub);margin-bottom:22px}
  .tag b{color:var(--cobalt)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
  .head{display:flex;align-items:center;gap:16px}
  .av{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#2b4acb,#6d8df7);
    color:#fff;font-size:23px;font-weight:700;display:flex;align-items:center;justify-content:center}
  h1{font-size:21px;display:flex;align-items:center;gap:9px;font-weight:700}
  .st{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .st i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
  .role{color:var(--sub);font-size:13.5px;margin-top:1px}
  .nums{margin-left:auto;text-align:right;color:var(--sub);font-size:12.5px;line-height:1.9}
  .nums b{color:var(--ink);font-size:16px;margin-right:3px}
  .tabs{display:flex;gap:22px;margin:24px 0 18px;font-size:14px;color:var(--sub)}
  .tabs span{padding-bottom:4px}
  .tabs .on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--cobalt)}
  /* 五隔间条 */
  .bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
  .bar i{display:block}
  .legend{display:flex;gap:16px;margin:12px 0 24px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
  .legend em{font-style:normal;display:flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .d-org{background:var(--org)}.d-dept{background:var(--dept)}.d-proj{background:var(--proj)}
  .d-own{background:var(--own)}.d-pair{background:var(--pair)}
  /* 记忆卡 */
  .mem{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid #f3eee6}
  .mem:last-child{border-bottom:none}
  .mem p{font-size:15px}
  .mem .src{margin-left:auto;color:var(--sub);font-size:12px;white-space:nowrap}
  .prop{background:#fffdf7;border:1px solid #f0e3c8;border-radius:14px;padding:16px 18px;margin-top:20px}
  .prop p{font-size:15px}
  .prop .to{color:var(--sub);font-size:12.5px;margin:3px 0 12px;display:flex;align-items:center;gap:6px}
  .btn{border:none;border-radius:10px;padding:8px 22px;font-size:14px;font-weight:600;cursor:default}
  .btn.primary{background:var(--cobalt);color:#fff}
  .btn.ghost{background:transparent;color:var(--sub);margin-left:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="tag"><b>原型 1</b> · 员工详情 —— 记忆按五层着色，一层一色，点层看层</div>

  <div class="card">
    <div class="head">
      <div class="av">清</div>
      <div>
        <h1>李清 <span class="st"><i></i>工作中</span></h1>
        <div class="role">财务结算专员 · Release v7</div>
      </div>
      <div class="nums"><b>142</b>条记忆<br><b>3</b>个进行中会话</div>
    </div>

    <div class="tabs"><span class="on">记忆</span><span>能力</span><span>设备</span></div>

    <div class="bar">
      <i style="width:22%;background:var(--org)"></i>
      <i style="width:41%;background:var(--dept)"></i>
      <i style="width:8%;background:var(--proj)"></i>
      <i style="width:26%;background:var(--own)"></i>
      <i style="width:3%;background:var(--pair)"></i>
    </div>
    <div class="legend">
      <em><span class="dot d-org"></span>组织 31</em>
      <em><span class="dot d-dept"></span>部门 58</em>
      <em><span class="dot d-proj"></span>项目 12</em>
      <em><span class="dot d-own"></span>私有 38</em>
      <em><span class="dot d-pair"></span>双边 3</em>
    </div>

    <div class="mem"><span class="dot d-own"></span><p>月结复核顺序：先银行流水，后费用报销</p><span class="src">3 天前</span></div>
    <div class="mem"><span class="dot d-own"></span><p>恒基发票抬头 7 月已变更</p><span class="src">4 天前</span></div>
    <div class="mem"><span class="dot d-pair"></span><p>王总监的偏好：先结论，后明细</p><span class="src">3 天前</span></div>

    <div class="prop">
      <p>跨部门对账差异处理 SOP，值得沉淀给部门</p>
      <div class="to"><span class="dot d-dept"></span>来自私有经验 · 4 次会话重复出现</div>
      <button class="btn primary">批准</button><button class="btn ghost">✕</button>
    </div>
  </div>
</div>
</body>
</html>
