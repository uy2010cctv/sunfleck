ke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h4l2 2h6v7H2z"/></svg> 项目部 · 共享工作区</div><a class="tree-item " href="2-project-space.html"><span>Q4 客户续约</span></a><div class="workspace-label"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h4l2 2h6v7H2z"/></svg> 财务部 · 共享工作区</div><a class="tree-item " href="1-employee-detail.html"><span>李清 · 对账差异</span></a><div class="workspace-label"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h4l2 2h6v7H2z"/></svg> 我的个人工作区</div><a class="tree-item " href="index.html"><span>私人助理</span></a><div class="tree-head"><span>群聊</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></div><a class="tree-item " href="3-group-team-chat.html"><span>Q4 续约团队</span></a><a class="tree-item " href="4-group-federated-chat.html"><span>华东区值班群</span></a><div class="tree-head"><span>频道</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></div><a class="tree-item " href="5-channel.html"><span># IT 值班</span></a><a class="tree-item " href="5-channel.html"><span># 制度公告</span></a></nav><div class="sidebar-bottom"><button class="lichen" data-note="数字员工管理从这里打开。"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M6 2v12"/></svg> Lichen Agent</button><button class="settings" data-note="原型保留现有设置入口。"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5"/><circle cx="8" cy="8" r="2"/></svg> 设置</button><div class="account"><span class="user-circle"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="5" r="2.5"/><path d="M3 14v-2a5 5 0 0 1 10 0v2"/></svg></span><span><strong>Kris</strong><small>@kris · administrator</small></span><span>退出登录</span></div><div class="prototype"><span>布局原型 · 示例内容</span><a href="index.html">返回首页</a></div></div></aside><main class="main"><header class="main-header"><div class="header-title"><button class="mobile-menu" data-menu aria-label="打开导航"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M6 2v12"/></svg></button></div><div class="header-actions"><button data-details aria-label="打开右侧详情"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M6 2v12"/></svg></button></div></header><div class="hero-stage"><div class="hero-block"><div class="hero-title"><img src="sunfleck-mark.svg" alt=""><div><h1>Intelligence, in symbiosis.</h1><p>让智能，自然生长。</p></div></div><div class="composer-wrap"><div class="context-controls"><span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h4l2 2h6v7H2z"/></svg>新媒体部 · 共享工作区<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 6 3 3 3-3"/></svg></span><span>标准模式<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 6 3 3 3-3"/></svg></span><span>数字员工<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 6 3 3 3-3"/></svg></span></div><form class="composer"><textarea aria-label="消息" placeholder="描述你想要构建的内容，/ 调用指令，@ 文件或对话"></textarea><div class="composer-tools"><button type="button" class="add" aria-label="添加附件" data-note="可在这里添加文件或调用指令。"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button><span>工作区内修改⌄</span><button type="button" class="knowledge" data-note="查看当前会话绑定的知识库。">知识库 4</button><span class="model">MiniMax-M3 Medium⌄</span><button class="send" aria-label="发送示例消息"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3m-4 4 4-4 4 4"/></svg></button></div></form></div></div></div><div class="hero-footer"></div></main></div><script>document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>notice(b.dataset.note));function notice(t){let n=document.querySelector('.toast');if(!n){n=document.createElement('div');n.className='toast';n.setAttribute('role','status');document.querySelector('.main').append(n)}n.textContent=t;setTimeout(()=>n.remove(),3500)}document.querySelectorAll('[data-close-details]').forEach(b=>b.onclick=()=>document.querySelector('.details').hidden=true);document.querySelectorAll('[data-details]').forEach(b=>b.onclick=()=>{const d=document.querySelector('.details');if(d)d.hidden=!d.hidden;else notice('此原型的会话详情未展开。')});document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>document.querySelector('.app').classList.toggle('show-sidebar'));document.querySelectorAll('.memory-scope button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.memory-scope button').forEach(x=>x.classList.toggle('selected',x===b));document.querySelectorAll('[data-scope]').forEach(x=>x.hidden=b.dataset.filter!=='all'&&x.dataset.scope!==b.dataset.filter)});document.querySelectorAll('form.composer').forEach(f=>f.onsubmit=e=>{e.preventDefault();const i=f.querySelector('textarea');if(!i.value.trim())return;let c=document.querySelector('.conversation');if(c){const d=document.createElement('div');d.className='message user';const b=document.createElement('div');b.className='user-bubble';b.textContent=i.value;d.append(b);c.append(d);d.scrollIntoView({block:'nearest'})}notice('示例消息已显示，未发送到真实服务。');i.value=''});</script></body></html>
